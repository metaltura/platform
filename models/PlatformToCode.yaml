                  `  title: ${titleOf(pattern, module, namespace)},`,
                  ...(buttons.length ? ['  buttons: [', ...buttons.map((b: string, i: number) => (i < buttons.length - 1 ? `${b},` : b)), `  ]${routeLines.length ? ',' : ''}`] : []),
                  ...routeLines,
                  '}'
                ]
