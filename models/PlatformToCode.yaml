                const name = pattern.pascalOf(composition.name)
                const properties: any[] = composition.properties ?? []
                const optional = (p: any): boolean => ['DocumentsProperty', 'EventProperty'].includes(p.instanceOf?.name)
                const props = properties.map((p: any) => `${pattern.camelOf(p.name)}${optional(p) ? '?' : ''}: ${propTypeOf(pattern, p)}`)
                // One type parameter per entity: the component takes any schema, as
                // `SchemaForm` does.
                const shapes = properties
                  .filter(isEntityProperty)
                  .map((p: any) => `${shapeOf(p)} extends FieldShape`)
                const generic = shapes.length ? `<${shapes.join(', ')}>` : ''
                const params = shapes.length ? `<${shapes.map((s: string) => s.split(' ')[0]).join(', ')}>` : ''
                const names = properties.map((p: any) => pattern.camelOf(p.name))
                const content = composition.content ? pattern.jsxOf(composition.content, namespace, 4) : ''
