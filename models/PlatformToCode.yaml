name: PlatformToCode
instanceOf: Core:Model
elements:
  - name: platform
    instanceOf: Core:Package
    elements:
      - name: PlatformToProject
        instanceOf: Core:Class
        icon: mui:Hub
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Container
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: >
              import { Folder, HtmlFile, MarkdownFile, TextFile, TypeScriptFile
              } from 'FileSystem'


              /**
               * PlatformToProject — the project of a platform application (PLAT-721).
               * Branched on the model a platform application lives in (the one the
               * Mapping of DomainToPlatform fills, PLAT-720), it writes a single npm
               * project on the published @kogitec/* packages, in the form of the
               * minimal app of the platform (PLAT-707):
               * - its configuration: `package.json`, `tsconfig.json`,
               *   `vite.config.ts`, `.npmrc`, `.gitignore`, `index.html`;
               * - `src/common/entities.ts`: one schema per entity the application
               *   employs, those its screens name in another model included
               *   (`entitiesOf`, PLAT-1459 C1), written with the declarative API
               *   (`docSchema`), and its type. Its meta says what the platform says of
               *   the same entity (PLAT-1460): the rights it declares (`access`) and, for
               *   a document that names its table, the PostgreSQL storage, the table,
               *   the key and the columns (`storage`, `sql`);
               * - `src/server/main.ts`: the server of the platform, which serves the
               *   documents of every schema the entities declare;
               * - `src/server/publications.ts`, when a screen subscribes to one: each
               *   publication the screens subscribe to, served as the platform serves a
               *   modelled publication (`publicationsFileOf`, G5 and Q9 of PLAT-1046);
               * - `src/common/i18n.ts`: the translated texts of the model, in French
               *   and in English, under the namespace of the application;
               * - `src/client/main.tsx`: the application and its modules;
               * - `src/client/<Module>.tsx`: one file per module, its buttons and its
               *   routes, each page as JSX (`jsxOf`), and a page that holds a state as a
               *   component of the file (`pageOf`, G3 of PLAT-1046);
               * - `src/client/<Composition>.tsx`: one component per composition its
               *   pages place (PLAT-950), directly or through another composition, its
               *   properties as props, which holds its states and computes its values
               *   from the expressions of the model (`heldOf`, G1 and G2 of PLAT-1046);
               * - `src/client/values.tsx`, when a component uses it: what they share to
               *   show the values of the model as the platform does;
               * - `README.md`: how to run the project on a computer, and how to point
               *   it at an existing PostgreSQL base when an entity names its table
               *   (`tablesOf`, PLAT-1460);
               * - `Dockerfile` and `.dockerignore`: the image of the project (PLAT-1461),
               *   the same text for every application. The token that reads the
               *   @kogitec/* packages is a BuildKit secret, read by the install only.
               * An element it cannot write is skipped and the server log says so,
               * with its path: the rest is written.
               */
              export default function (source) {
                const model: any = source
                const modules: any[] = this.modulesOf(model)
                if (modules.length === 0) log.warning(`${model.name}: no module, the menu is empty`)
                const first = modules[0]
                const title = first?.title?.fr || first?.title?.en || first?.name || model.name
                const name = this.kebabOf(first?.name ?? model.name)
                const namespace = this.namespaceOf(model)
                const entityNames = this.entitiesOf(model).map((entity: any) => this.pascalOf(entity.name))
                const tables = tablesOf(this, model)
                const compositions = compositionsOf(modules)
                const moduleFiles = modules.map((module: any) => ({
                  name: `${this.pascalOf(module.name)}Module`,
                  lines: moduleOf(this, module, namespace, entityNames, compositions)
                }))
                const compositionFiles = compositions.map((composition: any) => ({
                  name: this.pascalOf(composition.name),
                  lines: compositionOf(this, composition, namespace, compositions, entityNames)
                }))
                const code = [...moduleFiles, ...compositionFiles].flatMap((file) => file.lines).join('\n')
                // The publications the screens subscribe to, served by the server (G5, Q9).
                const publications = publicationsOf([...modules, ...compositions.map((c: any) => c.content).filter(Boolean)])
                // What the components share to show the values of the model, when one uses it.
                const valueFiles = VALUE_NAMES.some((fn) => new RegExp(`\\b${fn}\\(`).test(code))
                  ? [{ name: 'values', lines: VALUES }]
                  : []
                const textFile = (name: string, ext: string, fileType: string, lines: string[]) =>
                  new TextFile({ name: this.fileNameOf(name, ext), fileType, text: this.textOf(lines) })
                const tsFile = (name: string, ext: string, lines: string[]) =>
                  new TypeScriptFile({ name: this.fileNameOf(name, ext), text: this.textOf(lines) })
                return [
                  textFile('package', 'json', 'json', packageOf(name)),
                  textFile('tsconfig', 'json', 'json', TSCONFIG),
                  tsFile('vite__config', 'ts', VITE_CONFIG),
                  new HtmlFile({ name: this.fileNameOf('index', 'html'), text: this.textOf(indexOf(title)) }),
                  textFile('', 'npmrc', 'plaintext', NPMRC),
                  textFile('', 'gitignore', 'plaintext', ['node_modules', 'dist']),
                  // A name without `__` is written as is: `Dockerfile` has no extension.
                  new TextFile({ name: 'Dockerfile', fileType: 'dockerfile', text: this.textOf(DOCKERFILE) }),
                  textFile('', 'dockerignore', 'plaintext', DOCKERIGNORE),
                  new MarkdownFile({ name: this.fileNameOf('README', 'md'), text: this.textOf(readmeOf(title, name, tables)) }),
                  new Folder({
                    name: 'src',
                    entries: [
                      new Folder({
                        name: 'client',
                        entries: [
                          tsFile('main', 'tsx', clientMainOf(title, moduleFiles.map((file) => file.name))),
                          ...[...moduleFiles, ...compositionFiles, ...valueFiles].map((file) => tsFile(file.name, 'tsx', file.lines))
                        ]
                      }),
                      new Folder({
                        name: 'common',
                        entries: [
                          tsFile('entities', 'ts', entitiesOf(this, model)),
                          tsFile('i18n', 'ts', i18nOf(this, namespace, code, [...modules, ...compositions]))
                        ]
                      }),
                      new Folder({
                        name: 'server',
                        entries: [
                          tsFile('main', 'ts', serverMainOf(publications.length > 0)),
                          ...(publications.length ? [tsFile('publications', 'ts', publicationsFileOf(this, publications))] : [])
                        ]
                      })
                    ]
                  })
                ]
              }


              /** The elements a relation holds, a single one or a list. */

              function asList(value: any): any[] {
                return Array.isArray(value) ? value : value ? [value] : []
              }


              /** The children of an element through its composite relations, in
              order. */

              function partsOf(element: any): any[] {
                const parts: any[] = []
                for (const property of element.instanceOf?._getProperties?.() ?? []) {
                  if (!property.isRelation?.() || !property.composite) continue
                  parts.push(...asList(element[property.name]))
                }
                return parts
              }


              /** An element and everything it holds, depth first. */

              function treeOf(element: any): any[] {
                return [element, ...partsOf(element).flatMap(treeOf)]
              }


              /**
               * The compositions the pages of the modules place (PLAT-950), and those
               * the content of a composition places, in reading order: the component of
               * each placed component that is a composition (PLAT-1399 P3).
               */
              function compositionsOf(modules: any[]): any[] {
                const found: any[] = []
                const visit = (element: any) => {
                  for (const part of treeOf(element)) {
                    const kind = part.instanceOf?._inherits?.(e('Platform:component.ComponentInstance'))
                      ? part.component
                      : undefined
                    if (!kind?.instanceOf?._inherits?.(e('Platform:component.Composition')) || found.includes(kind)) continue
                    found.push(kind)
                    if (kind.content) visit(kind.content)
                  }
                }
                modules.forEach(visit)
                return found
              }


              /** The names a file imports from a package: those its JSX uses.
              */

              function usedIn(text: string, names: string[]): string[] {
                return names.filter((name) => new RegExp(`<${name}[\\s/>]`).test(text)).sort()
              }


              const CORE_COMPONENTS = ['Button', 'Column', 'Divider',
              'FormLayout', 'Grid', 'Page', 'Row', 'Section', 'Tab', 'Tabs',
              'Table', 'Text', 'Toolbar']

              // What a file names of `@kogitec/schema/client` outside of a tag.

              const SCHEMA_NAMES = ['DocFieldControl', 'SchemaForm',
              'useDocSubscriptionResult']

              const REACT_HOOKS = ['useEffect', 'useMemo', 'useState']


              /** What `src/client/values.tsx` exports, and the files import
              from it. */

              const VALUE_NAMES = ['asText', 'deleteDocument', 'formatCell',
              'holds', 'saveDocument', 'useDocServices', 'useDocsByLabel']


              /**
               * The import lines of a file of the client, for the text it holds: the
               * components its JSX places, the hooks of React it calls, what it calls of
               * `values.tsx`, the schemas it names and the compositions it places.
               */
              function importsOf(text: string, compositions: string[], entities:
              string[], extra: { core?: string[]; coreTypes?: string[] } = {}):
              string[] {
                const core = [...(extra.core ?? []), ...usedIn(text, CORE_COMPONENTS), ...(/\buseLang\(/.test(text) ? ['useLang'] : [])].sort()
                const coreTypes = extra.coreTypes ?? []
                const data = SCHEMA_NAMES.filter((n) => new RegExp(`\\b${n}\\b`).test(text)).sort()
                const own = usedIn(text, compositions)
                const hooks = REACT_HOOKS.filter((hook) => new RegExp(`\\b${hook}\\b`).test(text))
                const values = VALUE_NAMES.filter((fn) => new RegExp(`\\b${fn}\\(`).test(text))
                // A schema named as code: not in a key of a text, nor in a text.
                const schemas = entities.filter((name) => new RegExp(`(?<![\\w.:'"$])${name}(?![\\w'"])`).test(text)).sort()
                const named = [...core, ...coreTypes.map((t) => `type ${t}`)]
                const coreImport = core.length
                  ? `import { ${named.join(', ')} } from '@kogitec/core/client'`
                  : `import type { ${coreTypes.join(', ')} } from '@kogitec/core/client'`
                return [
                  ...(named.length ? [coreImport] : []),
                  ...(data.length ? [`import { ${data.join(', ')} } from '@kogitec/schema/client'`] : []),
                  ...(hooks.length ? [`import { ${hooks.join(', ')} } from 'react'`] : []),
                  ...(schemas.length ? [`import { ${schemas.join(', ')} } from '../common/entities'`] : []),
                  ...(values.length ? [`import { ${values.join(', ')} } from './values'`] : []),
                  ...own.map((name) => `import { ${name} } from './${name}'`)
                ]
              }


              /**
               * The text of a route as the router takes it: its page, then its
               * sub-routes. A page that holds a state or computes a value is a
               * component of the module file (`pageOf`), placed by the route.
               */
              function routeOf(pattern: any, route: any, namespace: string,
              indent: number, pages: string[][]): string[] {
                const pad = ' '.repeat(indent)
                if (typeof route.path !== 'string' || !route.path) {
                  log.warning(`${route._path()}: the route has no path, skipped`)
                  return []
                }
                let page = ''
                if (route.page && holdsState(route.page)) {
                  const lines = pageOf(pattern, route, namespace)
                  pages.push(lines)
                  page = `${pad}        <${pattern.pascalOf(route.name)}Page />`
                } else if (route.page) page = pattern.jsxOf(route.page, namespace, indent + 8)
                const children = asList(route.children).map((child: any) => routeOf(pattern, child, namespace, indent + 4, pages))
                const parts: string[][] = [
                  ...(page ? [[`${pad}    {`, `${pad}      index: true,`, `${pad}      element: (`, page, `${pad}      )`, `${pad}    }`]] : []),
                  ...children.filter((lines: string[]) => lines.length)
                ]
                return [
                  `${pad}{`,
                  `${pad}  path: '${route.path.replace(/^\/+/, '')}',`,
                  `${pad}  children: [`,
                  ...parts.flatMap((lines, i) => (i < parts.length - 1 ? [...lines.slice(0, -1), `${lines[lines.length - 1]},`] : lines)),
                  `${pad}  ]`,
                  `${pad}}`
                ]
              }


              /** Whether a placed component is the platform's state
              (`data.State`). */

              function isState(element: any): boolean {
                return !!element?.instanceOf?._inherits?.(e('Platform:component.ComponentInstance')) &&
                  element.component?._path?.() === 'PlatformComponents:data.State'
              }


              /** Whether a placed component is the platform's subscription
              (`data.Subscription`). */

              function isSubscription(element: any): boolean {
                return !!element?.instanceOf?._inherits?.(e('Platform:component.ComponentInstance')) &&
                  element.component?._path?.() === 'PlatformComponents:data.Subscription'
              }


              /** The publication a subscription names, when it is one of an
              entity. */

              function publicationOfSubscription(subscription: any): any {
                const publication = elementsOf(valueNamed(subscription, 'publication'))[0]
                return publication?.instanceOf?._inherits?.(e('Platform:Publication')) &&
                  publication.entity?.instanceOf?._inherits?.(e('Platform:Entity'))
                  ? publication
                  : undefined
              }


              /** The publications the subscriptions of `roots` name, each once,
              in reading order. */

              function publicationsOf(roots: any[]): any[] {
                const found: any[] = []
                for (const root of roots)
                  for (const part of treeOf(root)) {
                    const publication = isSubscription(part) ? publicationOfSubscription(part) : undefined
                    if (publication && !found.includes(publication)) found.push(publication)
                  }
                return found
              }


              /**
               * The lines of `src/server/publications.ts` (G5, Q9 of PLAT-1046): each
               * publication by `DocAdapter.publishResolved`, the call by which the
               * platform serves a modelled publication (`publishWebPublications`) — its
               * limit as it is, its documents read leniently, its related documents
               * sent —, and not by `DocAdapter.publish`, which stops at 20 documents. Its
               * order is the platform's (`toQuery`): the label of the entity, then the
               * key. Its `relations` are written from its lines as `describeRelations`
               * does: a link the document keeps, under the key it keeps it
               * (`clientId`), with its fields; an inverse relation, a sort, a condition
               * or a parameter is not written, and the server log says so.
               */
              function publicationsFileOf(pattern: any, publications: any[]):
              string[] {
                const blocks = publications.map((publication: any) => {
                  const schema = pattern.pascalOf(publication.entity.name)
                  for (const name of ['conditions', 'parameters', 'sort'])
                    if (asList(publication[name]).length) log.warning(`${publication._path()}: its ${name} are not written`)
                  const links: string[] = []
                  for (const line of asList(publication.relations)) {
                    const relation = line.relation
                    if (!relation || relation.opposite || relation.composite) {
                      log.warning(`${line._path()}: only a link the document keeps is written, skipped`)
                      continue
                    }
                    if (asList(line.relations).length) log.warning(`${line._path()}: its relations are not written`)
                    const key = `${pattern.camelOf(relation.name)}${relation.multiple ? 'Ids' : 'Id'}`
                    const fields = line.allFields
                      ? "fields: 'all'"
                      : asList(line.fields).length
                        ? `fields: [${asList(line.fields).map((f: any) => quoted(f.name)).join(', ')}]`
                        : ''
                    links.push(line.send === false ? `${key}: false` : `${key}: {${fields ? ` ${fields} ` : ''}}`)
                  }
                  const limit = typeof publication.limit === 'number' ? `, limit: ${publication.limit}` : ''
                  return [
                    `DocAdapter.publishResolved(${quoted(publication.name)}, () => ({`,
                    `  schema: ${schema},`,
                    `  query: { sort: byLabel(${schema})${limit} }${links.length ? ',' : ''}`,
                    ...(links.length ? [`  relations: { links: { ${links.join(', ')} } }`] : []),
                    '}))'
                  ]
                })
                const schemas = [...new Set(publications.map((p: any) => pattern.pascalOf(p.entity.name)))].sort()
                return [
                  '// The publications the screens subscribe to, served as the platform serves a',
                  '// modelled publication. Generated from the model: change the model, not this file.',
                  "import { type DocSortKey, type FieldShape, type Schema, SchemaUtil } from '@kogitec/schema/common'",
                  "import { DocAdapter } from '@kogitec/schema/server'",
                  `import { ${schemas.join(', ')} } from '../common/entities'`,
                  '',
                  '// The order of the platform: the label of the entity, then the key.',
                  'const byLabel = <Shape extends FieldShape>(schema: Schema<Shape>): DocSortKey[] =>',
                  "  [...new Set([SchemaUtil.labelField(schema), '_id'])].map((field) => ({ field, direction: 'asc' }))",
                  ...blocks.flatMap((block) => ['', ...block])
                ]
              }


              /** Whether what an element draws holds a state or computes a
              value. */

              function holdsState(element: any): boolean {
                return treeOf(element).some((part: any) => isState(part) || !!part.expression)
              }


              /**
               * The lines of the component of the page of a route (G3 of PLAT-1046),
               * `<Route>Page`: its states and the constants of its expressions, then the
               * `Page` and its cards. The key of its title does not change.
               */
              function pageOf(pattern: any, route: any, namespace: string):
              string[] {
                const name = `${pattern.pascalOf(route.name)}Page`
                const content = pattern.jsxOf(route.page, namespace, 4)
                const held = heldOf(pattern, route.page, `${name}Scope`, [], content, pattern.camelOf(route.name))
                return [
                  ...held.types,
                  ...held.constants,
                  `// The page of the route ${route.path}: it holds its states.`,
                  `const ${name} = () => {`,
                  ...held.hooks.map((line) => `  ${line}`),
                  '  return (',
                  wrapped(content, 4),
                  '  )',
                  '}',
                  ''
                ]
              }


              /** JSX that starts with a condition, between `<>` and `</>`. */

              function wrapped(content: string, indent: number): string {
                const pad = ' '.repeat(indent)
                if (!content.trimStart().startsWith('{')) return content
                return [`${pad}<>`, content.split('\n').map((line) => `  ${line}`).join('\n'), `${pad}</>`].join('\n')
              }


              /** The elements of the model a value names, or holds. */

              function elementsOf(value: any): any[] {
                const contained = asList(value?.contained)
                return contained.length ? contained : asList(value?.value)
              }


              /** The value a placed component gives a property, by its name. */

              function valueNamed(element: any, name: string): any {
                return asList(element.values).find((value: any) => value.property?.name === name)
              }


              /**
               * The TypeScript type of what a state holds: the schema type of its entity
               * (`Client`), a list of them when it is multiple; `unknown` for a type that
               * is not an entity.
               */
              function stateTypeOf(pattern: any, state: any): string {
                const entity = elementsOf(valueNamed(state, 'type'))[0]
                const one = entity?.instanceOf?._inherits?.(e('Platform:Entity')) ? pattern.pascalOf(entity.name) : 'unknown'
                return valueNamed(state, 'multiple')?.value === true ? `${one}[]` : one
              }


              /**
               * What the component written for a composition or for the page of a route
               * declares around its JSX (G1 to G3 of PLAT-1046), from `root`, what it
               * draws, and `content`, its JSX:
               * - `types`: `<Name>Scope`, what an expression reads — the props but the
               *   events, then the states —, all of them optional;
               * - `constants`: one per expression, its function copied as the model
               *   writes it, typed by `satisfies` (`scope`, and for a state of an entity
               *   its documents as `useEntityMemory` gives them); the platform's
               *   expressions and the conversion of PLAT-1653 compile so unchanged;
               * - `hooks`: the language of the screen when a cell is written; the
               *   documents of each entity a state computes from (`useDocsByLabel`);
               *   one hook per state, in their order — `useState` for a state that only
               *   actions write, `useMemo` for a state computed, both for a state
               *   computed that an action writes too: the action's value holds until
               *   what the expression reads changes (L4 of PLAT-1008) — each state
               *   seeing the props and the states before it; then `scope`, built at each
               *   drawing, when the JSX computes a value.
               * The names are those `jsxOf` gives: a state and `set<State>`, the
               * constant `<component><Value>`, after `prefix` — the route of a page.
               */
              function heldOf(pattern: any, root: any, scopeName: string, props:
              [string, string][], content: string, prefix = ''): { types:
              string[]; constants: string[]; hooks: string[] } {
                const camel = (name: string): string => pattern.camelOf(name)
                const pascal = (name: string): string => pattern.pascalOf(name)
                const tree = root ? treeOf(root) : []
                const states = tree.filter(isState)
                const constantOf = (owner: any, value: any): string =>
                  prefix ? `${prefix}${pascal(owner.name)}${pascal(value.name)}` : `${camel(owner.name)}${pascal(value.name)}`
                // The states an action writes.
                const written = new Set<any>()
                for (const part of tree)
                  for (const action of asList(part.actions))
                    if (['SetState', 'ClearState', 'SaveDocument', 'DeleteDocument'].includes(action.instanceOf?.name) && action.state)
                      written.add(action.state)
                // The states « vider » empties: a form that reads one restarts each time.
                const cleared = new Set<any>()
                for (const part of tree)
                  for (const action of asList(part.actions))
                    if (action.instanceOf?.name === 'ClearState' && action.state) cleared.add(action.state)
                // The entity of a state that reads the documents of its entity.
                const memoryOf = (state: any): string | undefined => {
                  const value = valueNamed(state, 'value')
                  const entity = elementsOf(valueNamed(state, 'type'))[0]
                  if (!value?.expression || value.source || !entity?.instanceOf?._inherits?.(e('Platform:Entity'))) return undefined
                  return pascal(entity.name)
                }

                const scopeEntries = [
                  ...props,
                  ...states.map((state: any): [string, string] => [camel(state.name), stateTypeOf(pattern, state)])
                ]

                const constants: string[] = []
                const seen = new Set<string>()
                for (const part of tree) {
                  for (const value of asList(part.values)) {
                    if (!value.expression) continue
                    const name = constantOf(part, value)
                    if (seen.has(name)) {
                      log.warning(`${value._path()}: the constant ${name} is already taken, the expression is not written`)
                      continue
                    }
                    seen.add(name)
                    const compute = value.expression.compute
                    const code = typeof compute === 'string' ? compute : typeof compute?.code === 'string' ? compute.code : undefined
                    const memory = isState(part) && value.property?.name === 'value' ? memoryOf(part) : undefined
                    const signature = memory ? `(scope: ${scopeName}, docs: ${memory}[]) => unknown` : `(scope: ${scopeName}) => unknown`
                    if (typeof code !== 'string' || !/^\s*export\s+default\s/.test(code)) {
                      log.warning(`${value.expression._path()}: the expression has no default export, it gives nothing`)
                      constants.push(`const ${name} = ((_scope) => undefined) satisfies ${signature}`)
                      continue
                    }
                    const body = code.trim().replace(/^export\s+default\s+/, '').replace(/;\s*$/, '')
                    constants.push(`const ${name} = (${body}) satisfies ${signature}`)
                  }
                }
                if (constants.length) constants.unshift('// The expressions of the model, as it writes them.')
                const definitions = tree
                  .filter(isSubscription)
                  .map(publicationOfSubscription)
                  .filter((p: any, i: number, all: any[]) => p && all.indexOf(p) === i)
                  .map((p: any) => `const ${camel(p.name)} = { name: '${p.name}', schema: ${pascal(p.entity.name)}, lenient: true }`)
                if (definitions.length) constants.unshift('// The publications the screen subscribes to, which the server serves.', ...definitions, '')
                if (constants.length) constants.push('')
                // The type of the scope, when an expression reads it.
                const types = constants.length || /\(scope\)/.test(content)
                  ? [`type ${scopeName} = {`, ...scopeEntries.map(([name, type]) => `  ${name}?: ${type}`), '}', '']
                  : []

                const hooks: string[] = []
                if (/\bformatCell\(/.test(content)) hooks.push('const language = useLang()')
                if (/\bservices\)/.test(content)) hooks.push('const services = useDocServices()')
                // Each subscription (G2): its publication by name, its documents read
                // leniently. Its parameters are not written (hors périmètre).
                for (const subscription of tree.filter(isSubscription)) {
                  const publication = publicationOfSubscription(subscription)
                  if (!publication) {
                    log.warning(`${subscription._path()}: the subscription names no publication of an entity, skipped`)
                    continue
                  }
                  if (asList(valueNamed(subscription, 'parameters')?.children).length || asList(subscription.values).some((v: any) => v.instanceOf?.name === 'ParameterValue'))
                    log.warning(`${subscription._path()}: the values of its parameters are not written`)
                  hooks.push(`useDocSubscriptionResult(${camel(publication.name)})`)
                }
                const memories: string[] = []
                for (const state of states) {
