                const text = [...props, ...held.types, ...held.constants, ...held.hooks, content].join('\n')
                const types = [
                  ...(text.includes('TranslationText') ? ["import type { TranslationText } from '@kogitec/core/common'"] : []),
                  ...(shapes.length ? ["import type { FieldShape, Schema } from '@kogitec/schema/common'"] : [])
