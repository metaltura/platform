                  .sort((a, b) => a.slice(a.indexOf("'")).localeCompare(b.slice(b.indexOf("'"))))
                const head = `export const ${name} = ${generic}(${names.length ? `{ ${names.join(', ')} }` : '_'}: ${name}Props${params})`
                // Without a hook, the component is its JSX, two spaces less deep.
                const body = held.hooks.length
                  ? [`${head} => {`, ...held.hooks.map((line) => `  ${line}`), '  return (', wrapped(content, 4) || '    <></>', '  )', '}']
                  : [`${head} => (`, wrapped(content, 4).split('\n').map((line) => line.replace(/^ {2}/, '')).join('\n') || '  <></>', ')']
                return [
                  `// The composition ${composition.name}: its properties are the props.`,
                  '// Generated from the model: change the model, not this file.',
                  ...imports,
                  '',
                  `export type ${name}Props${generic} = {`,
