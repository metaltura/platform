                    const name = /^[A-Za-z_$][\w$]*$/.test(key) ? key : quoted(key)
                    if (typeof value === 'string') return [`${pad}${name}: ${quoted(value)}${comma}`]
                    return [`${pad}${name}: {`, ...render(value, indent + 2), `${pad}}${comma}`]
                  })
                return [
                  `// The texts of the application, in the \`${namespace}\` namespace.`,
                  '// Generated from the model: change the model, not this file.',
                  'export const resources = {',
                  ...render({ fr: { [namespace]: tree('fr') }, en: { [namespace]: tree('en') } }, 2),
                  '}'
