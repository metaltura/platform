                  `// The module ${module.name} of the application: its buttons and its routes.`,
                  '// Generated from the model: change the model, not this file.',
                  ...importsOf(text, compositions.map((c: any) => pattern.pascalOf(c.name)), entities, { core, coreTypes: ['ModuleProps'] }),
