name: PlatformToCode
instanceOf: Core:Model
elements:
  - name: platform
    instanceOf: Core:Package
    elements:
      - name: PlatformToProject
        instanceOf: Core:Class
        icon: mui:Hub
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Container
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: >
              import { Folder, HtmlFile, MarkdownFile, TextFile, TypeScriptFile
              } from 'FileSystem'


              /**
               * PlatformToProject — the project of a platform application (PLAT-721).
               * Branched on the model a platform application lives in (the one the
               * Mapping of DomainToPlatform fills, PLAT-720), it writes a single npm
               * project on the published @kogitec/* packages, in the form of the
               * minimal app of the platform (PLAT-707):
               * - its configuration: `package.json`, `tsconfig.json`,
               *   `vite.config.ts`, `.npmrc`, `.gitignore`, `index.html`;
               * - `src/common/entities.ts`: one schema per entity the application
               *   employs, those its screens name in another model included
               *   (`entitiesOf`, PLAT-1459 C1), written with the declarative API
               *   (`docSchema`), and its type. Its meta says what the platform says of
               *   the same entity (PLAT-1460): the rights it declares (`access`) and, for
               *   a document that names its table, the PostgreSQL storage, the table,
               *   the key and the columns (`storage`, `sql`);
               * - `src/server/main.ts`: the server of the platform, which serves the
               *   documents of every schema the entities declare;
               * - `src/common/i18n.ts`: the translated texts of the model, in French
               *   and in English, under the namespace of the application;
               * - `src/client/main.tsx`: the application and its modules;
               * - `src/client/<Module>.tsx`: one file per module, its buttons and its
               *   routes, each page as JSX (`jsxOf`);
               * - `src/client/<Composition>.tsx`: one component per composition its
               *   pages place (PLAT-950), its properties as props;
               * - `README.md`: how to run the project on a computer, and how to point
               *   it at an existing PostgreSQL base when an entity names its table
               *   (`tablesOf`, PLAT-1460);
               * - `Dockerfile` and `.dockerignore`: the image of the project (PLAT-1461),
               *   the same text for every application. The token that reads the
               *   @kogitec/* packages is a BuildKit secret, read by the install only.
               * An element it cannot write is skipped and the server log says so,
               * with its path: the rest is written.
               */
              export default function (source) {
                const model: any = source
                const modules: any[] = this.modulesOf(model)
                if (modules.length === 0) log.warning(`${model.name}: no module, the menu is empty`)
                const first = modules[0]
                const title = first?.title?.fr || first?.title?.en || first?.name || model.name
                const name = this.kebabOf(first?.name ?? model.name)
                const namespace = this.namespaceOf(model)
                const entityNames = this.entitiesOf(model).map((entity: any) => this.pascalOf(entity.name))
                const tables = tablesOf(this, model)
                const compositions = compositionsOf(modules)
                const moduleFiles = modules.map((module: any) => ({
                  name: `${this.pascalOf(module.name)}Module`,
                  lines: moduleOf(this, module, namespace, entityNames, compositions)
                }))
                const compositionFiles = compositions.map((composition: any) => ({
                  name: this.pascalOf(composition.name),
                  lines: compositionOf(this, composition, namespace, compositions)
                }))
                const code = [...moduleFiles, ...compositionFiles].flatMap((file) => file.lines).join('\n')
                const textFile = (name: string, ext: string, fileType: string, lines: string[]) =>
                  new TextFile({ name: this.fileNameOf(name, ext), fileType, text: this.textOf(lines) })
                const tsFile = (name: string, ext: string, lines: string[]) =>
                  new TypeScriptFile({ name: this.fileNameOf(name, ext), text: this.textOf(lines) })
                return [
                  textFile('package', 'json', 'json', packageOf(name)),
                  textFile('tsconfig', 'json', 'json', TSCONFIG),
                  tsFile('vite__config', 'ts', VITE_CONFIG),
                  new HtmlFile({ name: this.fileNameOf('index', 'html'), text: this.textOf(indexOf(title)) }),
                  textFile('', 'npmrc', 'plaintext', NPMRC),
                  textFile('', 'gitignore', 'plaintext', ['node_modules', 'dist']),
                  // A name without `__` is written as is: `Dockerfile` has no extension.
                  new TextFile({ name: 'Dockerfile', fileType: 'dockerfile', text: this.textOf(DOCKERFILE) }),
                  textFile('', 'dockerignore', 'plaintext', DOCKERIGNORE),
                  new MarkdownFile({ name: this.fileNameOf('README', 'md'), text: this.textOf(readmeOf(title, name, tables)) }),
                  new Folder({
                    name: 'src',
                    entries: [
                      new Folder({
                        name: 'client',
                        entries: [
                          tsFile('main', 'tsx', clientMainOf(title, moduleFiles.map((file) => file.name))),
                          ...[...moduleFiles, ...compositionFiles].map((file) => tsFile(file.name, 'tsx', file.lines))
                        ]
                      }),
                      new Folder({
                        name: 'common',
                        entries: [
                          tsFile('entities', 'ts', entitiesOf(this, model)),
                          tsFile('i18n', 'ts', i18nOf(this, namespace, code, [...modules, ...compositions]))
                        ]
                      }),
                      new Folder({
                        name: 'server',
                        entries: [tsFile('main', 'ts', SERVER_MAIN)]
                      })
                    ]
                  })
                ]
              }


              /** The elements a relation holds, a single one or a list. */

              function asList(value: any): any[] {
                return Array.isArray(value) ? value : value ? [value] : []
              }


              /** The children of an element through its composite relations, in
              order. */

              function partsOf(element: any): any[] {
                const parts: any[] = []
                for (const property of element.instanceOf?._getProperties?.() ?? []) {
                  if (!property.isRelation?.() || !property.composite) continue
                  parts.push(...asList(element[property.name]))
                }
                return parts
              }


              /** An element and everything it holds, depth first. */

              function treeOf(element: any): any[] {
                return [element, ...partsOf(element).flatMap(treeOf)]
              }


              /**
               * The compositions the pages of the modules place (PLAT-950), and those
               * the content of a composition places, in reading order: the component of
               * each placed component that is a composition (PLAT-1399 P3).
               */
              function compositionsOf(modules: any[]): any[] {
                const found: any[] = []
                const visit = (element: any) => {
                  for (const part of treeOf(element)) {
                    const kind = part.instanceOf?._inherits?.(e('Platform:component.ComponentInstance'))
                      ? part.component
                      : undefined
                    if (!kind?.instanceOf?._inherits?.(e('Platform:component.Composition')) || found.includes(kind)) continue
                    found.push(kind)
                    if (kind.content) visit(kind.content)
                  }
                }
                modules.forEach(visit)
                return found
              }


              /** The names a file imports from a package: those its JSX uses.
              */

              function usedIn(text: string, names: string[]): string[] {
                return names.filter((name) => new RegExp(`<${name}[\\s/>]`).test(text)).sort()
              }


              const CORE_COMPONENTS = ['Button', 'Column', 'Divider',
              'FormLayout', 'Grid', 'Page', 'Row', 'Section', 'Tab', 'Tabs',
              'Text', 'Toolbar']

              const DATA_COMPONENTS = ['DocCard', 'DocForm', 'DocList',
              'DocScope']


              /** The import lines of a file of the client, for the JSX it
              holds. */

              function importsOf(text: string, compositions: string[], entities:
              string[], extra: { core?: string[]; coreTypes?: string[] } = {}):
              string[] {
                const core = [...(extra.core ?? []), ...usedIn(text, CORE_COMPONENTS)].sort()
                const coreTypes = extra.coreTypes ?? []
                const data = usedIn(text, DATA_COMPONENTS)
                const own = usedIn(text, compositions)
                const schemas = entities.filter((name) => new RegExp(`\\{${name}\\}`).test(text)).sort()
                const named = [...core, ...coreTypes.map((t) => `type ${t}`)]
                const coreImport = core.length
                  ? `import { ${named.join(', ')} } from '@kogitec/core/client'`
                  : `import type { ${coreTypes.join(', ')} } from '@kogitec/core/client'`
                return [
                  ...(named.length ? [coreImport] : []),
                  ...(data.length ? [`import { ${data.join(', ')} } from '@kogitec/schema/client'`] : []),
                  ...(schemas.length ? [`import { ${schemas.join(', ')} } from '../common/entities'`] : []),
                  ...own.map((name) => `import { ${name} } from './${name}'`)
                ]
              }


              /** The text of a route as the router takes it: its page, then its
              sub-routes. */

              function routeOf(pattern: any, route: any, namespace: string,
              indent: number): string[] {
                const pad = ' '.repeat(indent)
                if (typeof route.path !== 'string' || !route.path) {
                  log.warning(`${route._path()}: the route has no path, skipped`)
                  return []
                }
                const page = route.page ? pattern.jsxOf(route.page, namespace, indent + 8) : ''
                const children = asList(route.children).map((child: any) => routeOf(pattern, child, namespace, indent + 4))
                const parts: string[][] = [
                  ...(page ? [[`${pad}    {`, `${pad}      index: true,`, `${pad}      element: (`, page, `${pad}      )`, `${pad}    }`]] : []),
                  ...children.filter((lines: string[]) => lines.length)
                ]
                return [
                  `${pad}{`,
                  `${pad}  path: '${route.path.replace(/^\/+/, '')}',`,
                  `${pad}  children: [`,
                  ...parts.flatMap((lines, i) => (i < parts.length - 1 ? [...lines.slice(0, -1), `${lines[lines.length - 1]},`] : lines)),
                  `${pad}  ]`,
                  `${pad}}`
                ]
              }


              /** The text of a key of the texts, or the name when the text is
              empty. */

              function titleOf(pattern: any, element: any, namespace: string):
              string {
                const text = element.title
                if (text && (text.fr || text.en)) return `'${namespace}:${pattern.textKeyOf(text)}'`
                return `{ fr: '${element.name}', en: '${element.name}' }`
              }


              /**
               * The lines of `src/client/<Module>.tsx`: the module as the application
               * takes it (PLAT-712) — its name, its title, a button per button of the
               * model and its route, each page written by `jsxOf`.
               */
              function moduleOf(pattern: any, module: any, namespace: string,
              entities: string[], compositions: any[]): string[] {
                const name = `${pattern.pascalOf(module.name)}Module`
                const buttons = asList(module.buttons)
                  .filter((button: any) => typeof button.path === 'string' && button.path)
                  .map((button: any) => {
                    const path = button.path.startsWith('/') ? button.path : `/${button.path}`
                    const icon = button.icon ? `, icon: <CoreIcon icon='${button.icon}' />` : ''
                    return `    { title: ${titleOf(pattern, button, namespace)}, path: '${path}'${icon} }`
                  })
                const route = asList(module.route)[0]
                const routeLines = route ? routeOf(pattern, route, namespace, 2) : []
                if (routeLines.length) routeLines[0] = `  route: ${routeLines[0].trimStart()}`
                const body = [
                  `export const ${name}: ModuleProps = {`,
                  `  name: '${module.name}',`,
                  `  title: ${titleOf(pattern, module, namespace)},`,
                  ...(buttons.length ? ['  buttons: [', ...buttons.map((b: string, i: number) => (i < buttons.length - 1 ? `${b},` : b)), `  ]${routeLines.length ? ',' : ''}`] : []),
                  ...routeLines,
                  '}'
                ]
                const text = body.join('\n')
                const core = text.includes('<CoreIcon') ? ['CoreIcon'] : []
                return [
                  `// The module ${module.name} of the application: its buttons and its routes.`,
                  '// Generated from the model: change the model, not this file.',
                  ...importsOf(text, compositions.map((c: any) => pattern.pascalOf(c.name)), entities, { core, coreTypes: ['ModuleProps'] }),
                  '',
                  ...body
                ]
              }


              /** The type parameter of the schema an entity property takes
              (`EntityShape`). */

              function shapeOf(property: any): string {
                const name = String(property.name)
                return `${name.charAt(0).toUpperCase()}${name.slice(1)}Shape`
              }


              /**
               * Whether a property of a composition holds an entity: an element of the
               * model of type `Platform:Entity`, whose prop takes the schema of its
               * documents (PLAT-1399 P3).
               */
              function isEntityProperty(property: any): boolean {
                return property.instanceOf?.name === 'ElementProperty' &&
                  !property.multiple &&
                  !!property.type?._inherits?.(e('Platform:Entity'))
              }


              /** The type of a prop of a composition, after the vocation of its
              property. */

              function propTypeOf(property: any): string {
                const vocation = property.instanceOf?.name
                if (vocation === 'I18nTextProperty') return 'TranslationText'
                if (isEntityProperty(property)) return `Schema<${shapeOf(property)}>`
                if (vocation === 'NumberProperty') return 'number'
                if (vocation === 'BooleanProperty') return 'boolean'
                if (vocation === 'TextProperty' || vocation === 'EnumProperty') return 'string'
                log.warning(`${property._path()}: the type of this property is not written, unknown`)
                return 'unknown'
              }


              /**
               * The lines of `src/client/<Composition>.tsx`: a component with a prop
               * per property of the composition, which draws its content (PLAT-950).
               */
              function compositionOf(pattern: any, composition: any, namespace:
              string, compositions: any[]): string[] {
                const name = pattern.pascalOf(composition.name)
                const properties: any[] = composition.properties ?? []
                const props = properties.map((p: any) => `${pattern.camelOf(p.name)}: ${propTypeOf(p)}`)
                // One type parameter per entity: the component takes any schema, as
                // `DocScope` does.
                const shapes = properties
                  .filter(isEntityProperty)
                  .map((p: any) => `${shapeOf(p)} extends FieldShape`)
                const generic = shapes.length ? `<${shapes.join(', ')}>` : ''
                const params = shapes.length ? `<${shapes.map((s: string) => s.split(' ')[0]).join(', ')}>` : ''
                const names = properties.map((p: any) => pattern.camelOf(p.name))
                const content = composition.content ? pattern.jsxOf(composition.content, namespace, 2) : ''
                if (!content) log.warning(`${composition._path()}: the composition has no content`)
                const text = props.join('\n') + content
                const types = [
                  ...(text.includes('TranslationText') ? ["import type { TranslationText } from '@kogitec/core/common'"] : []),
                  ...(shapes.length ? ["import type { FieldShape, Schema } from '@kogitec/schema/common'"] : [])
                ]
                const imports = [...importsOf(content, compositions.map((c: any) => pattern.pascalOf(c.name)), []), ...types]
                  .sort((a, b) => a.slice(a.indexOf("'")).localeCompare(b.slice(b.indexOf("'"))))
                return [
                  `// The composition ${composition.name}: its properties are the props.`,
                  '// Generated from the model: change the model, not this file.',
                  ...imports,
                  '',
                  `export type ${name}Props${generic} = {`,
                  ...props.map((p: string) => `  ${p}`),
                  '}',
                  '',
                  `export const ${name} = ${generic}(${names.length ? `{ ${names.join(', ')} }` : '_'}: ${name}Props${params}) => (`,
                  content || '  <></>',
                  ')'
                ]
              }


              /** A text between single quotes. */

              function quoted(text: string): string {
                return `'${text.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`
              }


              /**
               * The lines of `src/common/i18n.ts`: the texts the code names, in French
               * and in English, under the namespace of the application; a language
               * left empty takes the other one's text (PLAT-712).
               */
              function i18nOf(pattern: any, namespace: string, code: string,
              roots: any[]): string[] {
                const texts = new Map<string, any>()
                for (const root of roots) {
                  for (const part of treeOf(root.content ?? root)) {
                    if (part.instanceOf?._inherits(e('Platform:I18nString'))) texts.set(pattern.textKeyOf(part), part)
                  }
                }
                const used = [...code.matchAll(new RegExp(`'${namespace}:([^']+)'`, 'g'))].map((m) => m[1])
                const keys = used.filter((key, i) => used.indexOf(key) === i && texts.has(key))
                const tree = (lang: 'fr' | 'en'): any => {
                  const root: any = {}
                  for (const key of keys) {
                    const text = texts.get(key)
                    const value = (lang === 'fr' ? text.fr || text.en : text.en || text.fr) ?? ''
                    const segments = key.split('.')
                    let node = root
                    segments.slice(0, -1).forEach((s) => (node = node[s] ??= {}))
                    node[segments[segments.length - 1]] = value
                  }
                  return root
                }
                const render = (node: any, indent: number): string[] =>
                  Object.entries(node).flatMap(([key, value], i, all) => {
                    const pad = ' '.repeat(indent)
                    const comma = i < all.length - 1 ? ',' : ''
                    const name = /^[A-Za-z_$][\w$]*$/.test(key) ? key : quoted(key)
                    if (typeof value === 'string') return [`${pad}${name}: ${quoted(value)}${comma}`]
                    return [`${pad}${name}: {`, ...render(value, indent + 2), `${pad}}${comma}`]
                  })
                return [
                  `// The texts of the application, in the \`${namespace}\` namespace.`,
                  '// Generated from the model: change the model, not this file.',
                  'export const resources = {',
                  ...render({ fr: { [namespace]: tree('fr') }, en: { [namespace]: tree('en') } }, 2),
                  '}'
                ]
              }


              /** The lines of `src/client/main.tsx`: the application and its
              modules. */

              function clientMainOf(title: string, modules: string[]): string[]
              {
                return [
                  "import { AuthGate } from '@kogitec/security/client'",
                  "import { Application, createI18n } from '@kogitec/workbench/client'",
                  "import { createRoot } from 'react-dom/client'",
                  "import { resources } from '../common/i18n'",
                  ...modules.map((name) => `import { ${name} } from './${name}'`),
                  '',
                  "// The platform's texts, then the application's own.",
                  'const i18n = createI18n(resources)',
                  '',
                  "createRoot(document.getElementById('react-target')!).render(",
                  '  <AuthGate>',
                  '    <Application',
                  `      name=${quoted(title)}`,
                  "      logo=''",
                  '      i18n={i18n}',
                  `      modules={[${modules.join(', ')}]}`,
                  '    />',
                  '  </AuthGate>',
                  ')'
                ]
              }


              /**
               * The tables of the entities that live in PostgreSQL (PLAT-1460): the
               * entity's name and its table, as `sqlOf` reads it, in the order of the
               * entities. A table two entities share is named once, with the first.
               */
              function tablesOf(pattern: any, model: any): [string, string][] {
                const tables: [string, string][] = []
                for (const entity of pattern.entitiesOf(model)) {
                  const table = sqlOf(pattern, entity, [])?.table
                  if (table && !tables.some(([, t]) => t === table)) tables.push([pattern.pascalOf(entity.name), table])
                }
                return tables
              }


              /**
               * The lines of `README.md` (rule 11): the token, MongoDB, `npm install`,
               * `npm start`, the address, and what `npm install` says without a token.
               * When an entity names its table, a section says how to point the server at
               * the PostgreSQL base (PLAT-1460 rule 13, `postgresOf`). Then how to build
               * and start the image (PLAT-1461 rules 4, 6, 11 and 17, `imageOf`) and every
               * variable the server reads (rule 15, `variablesOf`). `name` is the name of
               * the npm project: it names the MongoDB container and the image (rule 18).
               */
              function readmeOf(title: string, name: string, tables: [string,
              string][]): string[] {
                return [
                  `# ${title} — on the platform`,
                  '',
                  'Generated by simple-mda from a platform application: edit the model, not',
                  'these files. A single npm project on the published `@kogitec/*` packages:',
                  'the server of the platform serves the application and its interface.',
                  '',
                  '## Run',
                  '',
                  '1. Create a GitHub token with the `read:packages` scope: the `@kogitec/*`',
                  '   packages are published on GitHub Packages.',
                  '2. Put it in `NODE_AUTH_TOKEN`: `export NODE_AUTH_TOKEN=<the token>`.',
                  '3. Start MongoDB 7 as a replica set:',
                  '',
                  '   ```bash',
                  `   docker run -d --name ${name}-mongo -p 27017:27017 mongo:7 --replSet rs0`,
                  `   docker exec ${name}-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'`,
                  '   ```',
                  '',
                  '4. `npm install`.',
                  '5. `npm start` — builds the interface, then starts the server.',
                  '6. Open `http://localhost:8081`.',
                  '',
                  '`MONGO_URL` names the database (by default `mongodb://localhost:27017/kogitec`),',
                  '`PORT` the port. Without MongoDB the server starts, says so once, and the',
                  'lists of the entities without a table stay empty. Under `npm start` the',
                  'sign-in is not required: without a sign-in provider (`OAUTH_*`) the',
                  'application opens as « Développeur local ». `npm run typecheck` checks the',
                  'types. « Configure the server » names every variable the server reads.',
                  '',
                  ...postgresOf(tables),
                  ...imageOf(name),
                  ...variablesOf(),
                  '## `npm install` without a token',
                  '',
                  '```',
                  'npm error code E401',
                  'npm error 401 Unauthorized - GET https://npm.pkg.github.com/@kogitec%2fcore - unauthenticated: User cannot be authenticated with the token provided.',
                  '```',
                  '',
                  '`NODE_AUTH_TOKEN` is empty or has no `read:packages` scope: GitHub Packages',
                  'refuses to read the first `@kogitec/*` package. Steps 1 and 2 fix it. The',
                  'build of the image stops on the same `npm error code E401`; without any',
                  'token its second line ends with `authentication token not provided`.'
                ]
              }


              /**
               * The section « Build the image » of `README.md` (PLAT-1461 rules 4, 6, 11
               * and 17), and its blank line: the build with the token as a secret, the
               * refusal without the sign-in provider as the log of the image writes it, and
               * a start on a computer that reaches the MongoDB of « Run » through the host.
               */
              function imageOf(name: string): string[] {
                return [
                  '## Build the image',
                  '',
                  'The `Dockerfile` builds the project into an image that builds its interface',
                  'and serves it from the start. The token is passed as a build secret, read by',
                  'the install only: no layer of the image keeps it. From this folder:',
                  '',
                  '```bash',
                  `NODE_AUTH_TOKEN=<the token> docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -t ${name} .`,
                  '```',
                  '',
                  'The build needs BuildKit, the default of Docker since version 23. The',
                  'versions of the packages are those of `package-lock.json` when there is one,',
                  'else the latest the ranges of `package.json` allow.',
                  '',
                  'The image requires the sign-in (`REQUIRE_AUTH=true`). Started without a',
                  'sign-in provider, it does not start, and its log names what is missing:',
                  '',
                  '```text',
                  'server not started: REQUIRE_AUTH=true needs an identity provider: set OAUTH_ISSUER, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET',
                  '```',
                  '',
                  'To try it on a computer, `REQUIRE_AUTH=false` opens the session of',
                  '« Développeur local », and the MongoDB of « Run » is reached through the host:',
                  '',
                  '```bash',
                  `docker run --rm -p 8081:8081 -e REQUIRE_AUTH=false \\`,
                  '  --add-host=host.docker.internal:host-gateway \\',
                  "  -e 'MONGO_URL=mongodb://host.docker.internal:27017/kogitec?directConnection=true' \\",
                  `  ${name}`,
                  '```',
                  '',
                  'Then open `http://localhost:8081`. Keep `directConnection=true`: without it,',
                  'the driver follows the replica set to `localhost:27017`, which inside the',
                  'container is the container itself, and the lists stay empty.',
                  ''
                ]
              }


              /**
               * The section « Configure the server » of `README.md` (PLAT-1461 rule 15),
               * and its blank line: every variable the published `@kogitec/*` packages read,
               * what it says, and what happens without it. Each « Without it » was checked
               * by starting the image with and without the variable (rule 16), and the
               * messages are copied from its log.
               */
              function variablesOf(): string[] {
                return [
                  '## Configure the server',
                  '',
                  'The server reads its settings from the environment only.',
                  '',
                  '| Variable | What it says | Without it |',
                  '| --- | --- | --- |',
                  '| `PORT` | The port of the server | `8081` |',
