                  }
                  for (const x of lineage) {
                    for (const relation of asList(x.relations)) {
                      keep(relation.type)
                    }
                  }
                }
                return entities
              }
          - name: modulesOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: model
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Container
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Platform:Module
            code: |
              /**
               * The modules of a platform application (PLAT-711): the `Platform:Module` at
               * the root of its model, in reading order.
               */
              export default function (model) {
                const moduleClass = e('Platform:Module')
                const elements: any[] = model.elements ?? []
                return elements.filter((element: any) => element.instanceOf?._inherits(moduleClass))
              }
          - name: namespaceOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: model
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Container
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The namespace of the application: the name of its first module in
               * camelCase (`boutique`), else the name of its model. The schemas carry
               * it, and the texts of the application live under it.
               */
              export default function (model) {
                const first = this.modulesOf(model)[0]
                return this.camelOf(first ? first.name : model.name)
              }
          - name: isDocument
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Platform:Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:Boolean
            code: |
              /**
               * True when the chain of `extends` of an entity reaches `Platform:Doc`: the
               * entity is a document, with its collection and its `_id` (PLAT-718).
               */
              export default function (entity) {
                const doc = e('Platform:Doc')
                const seen: any[] = []
                for (let current: any = entity; current && !seen.includes(current); current = current.extends) {
                  if (current === doc) return true
                  seen.push(current)
                }
                return false
              }
          - name: schemaFieldOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: feature
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Feature
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The schema field of a field or a relation of a modelled entity, as
               * TypeScript (PLAT-718, as `buildSchemas` of the platform does it):
               * - a field: `string()`, `number()`, `boolean()`, `date()` after its
               *   type, `enumField([...])` for a list of values, and the six sorts of an
               *   existing base (PLAT-1460, as `toField` of the platform does it):
               *   `long()`, `decimal({ scale })` (its scale when it is a whole number,
               *   0 or more), `localDate()`, `dateTime()`, `time()`, `json()`;
               * - a relation kept in its document: the key of the document it points
               *   to, `refString(Client)`, with the meta the platform reads (`ref`,
               *   `relation`); a composite relation: the sub-document,
               *   `nested(Ligne)`;
               * then a list of them when it is multiple (one at least when it is also
               * mandatory), and optional unless mandatory. An empty text when the
               * pattern cannot write it: a type it does not know, a relation to a
               * document kept in place or a key to a sub-document. The server log
               * says which, with the path of the element.
               */
              export default function (feature) {
                const f: any = feature
                let one: string
                if (f.instanceOf?._inherits(e('Platform:EntityRelation'))) {
                  const target = this.pascalOf(f.type?.name ?? '')
                  if (!f.type) {
                    log.warning(`${f._path()}: the relation has no entity, skipped`)
                    return ''
                  }
                  if (!!f.composite === this.isDocument(f.type)) {
                    const kind = f.composite ? 'a document kept in place' : 'a key to a sub-document'
                    log.warning(`${f._path()}: ${kind} is not written, skipped`)
                    return ''
                  }
                  one = f.composite ? `nested(${target})` : `refString(${target})`
                } else {
                  const type = f.type
                  const values: string[] = type?.instanceOf?._inherits(e('Core:Enum'))
                    ? [...(type.values ?? [])]
                    : []
                  const primitives: Record<string, string> = {
                    'Core:String': 'string()',
                    'Core:Number': 'number()',
                    'Core:Boolean': 'boolean()',
                    'Core:Date': 'date()',
                    'Platform:Long': 'long()',
                    'Platform:LocalDate': 'localDate()',
                    'Platform:DateTime': 'dateTime()',
                    'Platform:Time': 'time()',
                    'Platform:Json': 'json()'
                  }
                  const path = type?._path?.() ?? ''
                  if (values.length > 0) {
                    one = `enumField([${values.map((v) => `'${v}'`).join(', ')}])`
                  } else if (path === 'Platform:Decimal') {
                    // Its scale counts only when it is a whole number, 0 or more.
                    one = Number.isInteger(f.scale) && f.scale >= 0 ? `decimal({ scale: ${f.scale} })` : 'decimal()'
                  } else if (primitives[path]) {
                    one = primitives[path]
                  } else {
                    log.warning(`${f._path()}: the type ${path || '(none)'} is not written, skipped`)
                    return ''
                  }
                }
                let shaped = f.multiple ? `array(${one})${f.mandatory ? '.min(1)' : ''}` : one
                if (f.instanceOf?._inherits(e('Platform:EntityRelation')) && !f.composite) {
                  const target = this.pascalOf(f.type.name)
                  shaped = `${shaped}.withMeta({ ref: ${target}, relation: '${this.camelOf(f.name)}' })`
                }
                return f.mandatory ? shaped : `optional(${shaped})`
              }
          - name: jsxOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: element
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Element
              - name: namespace
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:String
              - name: indent
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Number
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * A modelled component as JSX (Q1, choice 1), at `indent` spaces, its
               * children two spaces deeper. The element is a placed component
               * (`Platform:component.ComponentInstance`, PLAT-1399 P3), written under the
               * name of the component it places and with its values:
               * - a component of the catalogue (`PlatformComponents:layout.Page`) by its
               *   name, each value a prop: a translated text as the key of its text
               *   (`'boutique:…'`), a style as an object, a zone as JSX, a list of
               *   values as its text, a number or a yes/no as such;
               * - a value read or computed (G2 of PLAT-1046) as the variable it reads —
               *   a state, a prop of the composition, a field of the document a state
               *   holds — or as the call of the constant its expression became, with
               *   `scope`; a translated text read or computed is the same text in both
               *   languages (`asText`);
               * - an event as a function that plays its actions in order and stops when
               *   one gives `false`, as `runActions`: « choisir » (`SetState`), « vider »
               *   (`ClearState`), « lever un événement » (`RaiseEvent`), « enregistrer »
               *   (`SaveDocument`, the draft of the form on its submission, then the
               *   document saved for the actions after it) and « supprimer »
               *   (`DeleteDocument`, once confirmed); an action it does not write stops
               *   the ones after it, and the server log says so;
               * - a state (`data.State`) and a subscription (`data.Subscription`) as
               *   nothing: the component written for the composition or the page holds
               *   them;
               * - a form (`data.Form`) as `SchemaForm` on the document it reads, keyed by
               *   its key — and by the times its state was emptied —, its field controls
               *   (`data.EntityFieldControl`) as `DocFieldControl` on the key of the field;
               * - a condition (`logic.If`) as a conditional expression between braces;
               * - a `Table` that shows a list (`items`) as the `Table` of the platform,
               *   each cell written as the platform writes it (`formatCell`);
               * - a card of a composition (PLAT-950) as the component the project
               *   writes for the composition, with the values of the card.
               * The names it gives — a state and its setter, the constant of an
               * expression — are the ones `compositionOf` and `pageOf` declare. An
               * element the pattern cannot write gives an empty text, and the server
               * log says so with its path.
               */
              export default function (element, namespace, indent) {
                const el: any = element
                const pad = ' '.repeat(indent)
                const quote = (text: string): string =>
                  text.includes("'") || text.includes('\n') ? `{${JSON.stringify(text)}}` : `'${text}'`
                const textOf = (text: any): string | undefined => {
                  const fr = typeof text?.fr === 'string' ? text.fr : ''
                  const en = typeof text?.en === 'string' ? text.en : ''
                  return fr || en ? `'${namespace}:${this.textKeyOf(text)}'` : undefined
                }
                const sidesOf = (sides: any): string | undefined => {
                  if (!sides) return undefined
                  const all = typeof sides.all === 'number' ? sides.all : undefined
                  const own = ['top', 'right', 'bottom', 'left'].filter((s) => typeof sides[s] === 'number')
                  if (own.length === 0) return all === undefined ? undefined : String(all)
                  const parts = ['top', 'right', 'bottom', 'left']
                    .map((s) => [s, own.includes(s) ? sides[s] : all])
                    .filter(([, v]) => v !== undefined)
                    .map(([s, v]) => `${s}: ${v}`)
                  return `{ ${parts.join(', ')} }`
                }
                const lengthOf = (value: any): string | undefined => {
                  if (typeof value !== 'string' || !/^\d+(\.\d+)?%?$/.test(value)) return undefined
                  return value.endsWith('%') ? `'${value}'` : value
                }
                const styleOf = (style: any): string | undefined => {
                  if (!style) return undefined
                  const parts = [
                    ['margin', sidesOf(style.margin)],
                    ['padding', sidesOf(style.padding)],
                    ['width', lengthOf(style.width)],
                    ['height', lengthOf(style.height)]
                  ].filter(([, v]) => v !== undefined).map(([k, v]) => `${k}: ${v}`)
                  return parts.length ? `{{ ${parts.join(', ')} }}` : undefined
                }
                const asList = (value: any): any[] => (Array.isArray(value) ? value : value ? [value] : [])
                const isA = (x: any, path: string): boolean => {
                  const clazz = e(path)
                  return !!clazz && !!x?.instanceOf && (x.instanceOf === clazz || !!x.instanceOf._inherits?.(clazz))
                }
                const pascal = (name: string): string => this.pascalOf(name)
                const camel = (name: string): string => this.camelOf(name)
                // The value the placed component gives a property, by the name of the property.
                const valueOf = (name: string): any =>
                  asList(el.values).find((value: any) => value.property?.name === name)
                // The elements of the model a value names, or holds.
                const elementsOf = (value: any): any[] => {
                  const contained = asList(value?.contained)
                  return contained.length ? contained : asList(value?.value)
                }
                const zoneOf = (name: string): any[] => asList(valueOf(name)?.children)
                const childrenOf = (elements: any[], depth: number): string[] =>
                  elements.map((child: any) => this.jsxOf(child, namespace, depth)).filter((t: string) => t)
                // A long tag, or one whose prop spans lines, has a prop per line.
                const tag = (name: string, attrs: string[], children: string[], at = pad): string => {
                  const inline = `${at}<${name}${attrs.map((a) => ` ${a}`).join('')}`
                  const open = (inline.length <= 100 || attrs.length < 2) && !attrs.some((a) => a.includes('\n'))
                    ? inline
                    : [`${at}<${name}`, ...attrs.map((a) => `${at}  ${a.split('\n').join('\n  ')}`)].join('\n')
                  if (children.length === 0) return `${open} />`
                  return [`${open}>`, ...children, `${at}</${name}>`].join('\n')
                }

                // The composition, or the page of a route, the element is drawn in: the
                // component written for it holds its states and builds its `scope`.
                let holder: any
                for (let x: any = el; x; x = x._getComposer?.()) {
                  if (isA(x, 'Platform:component.Composition')) {
                    holder = x
                    break
                  }
                  if (isA(x._getComposer?.(), 'Platform:Route')) {
                    holder = x
                    break
                  }
                }
                const route: any = holder && !isA(holder, 'Platform:component.Composition') ? holder._getComposer() : undefined
                // Everything the holder draws, depth first.
                const treeOf = (x: any): any[] => {
                  const parts: any[] = []
                  for (const property of x.instanceOf?._getProperties?.() ?? []) {
                    if (!property.isRelation?.() || !property.composite) continue
                    parts.push(...asList(x[property.name]))
                  }
                  return [x, ...parts.flatMap(treeOf)]
                }
                const isState = (x: any): boolean =>
                  isA(x, 'Platform:component.ComponentInstance') && x.component?._path?.() === 'PlatformComponents:data.State'
                const states: any[] = holder ? treeOf(holder.content ?? holder).filter(isState) : []
                // The constant of an expression: the placed component, then the value,
                // after the route for a page — the pages of a module share its file.
                const constantOf = (owner: any, value: any): string => {
                  const own = `${pascal(owner.name)}${pascal(value.name)}`
                  return route ? `${camel(route.name)}${own}` : `${camel(owner.name)}${pascal(value.name)}`
                }
                // The entity of a state, and whether it holds a field of it.
                const entityOf = (state: any): any =>
                  elementsOf(asList(state.values).find((value: any) => value.property?.name === 'type'))[0]
                const isMultiple = (state: any): boolean =>
                  asList(state.values).find((value: any) => value.property?.name === 'multiple')?.value === true
                const holds = (entity: any, feature: any): boolean => {
                  const seen: any[] = []
                  for (let x = entity; x && !seen.includes(x); x = ([] as any[]).concat(x.extends ?? [])[0]) {
                    if (x === feature._getComposer?.()) return true
                    seen.push(x)
                  }
                  return false
                }
                // What a source reads (readSource of the platform): a state, a property
                // of the composition, or a field of the document the nearest state of its
                // entity holds — the last one, a single document.
                const sourceText = (source: any): string | undefined => {
                  if (isState(source)) return camel(source.name)
                  if (holder && source._getComposer?.() === holder) return camel(source.name)
                  if (isA(source._getComposer?.(), 'Platform:Entity')) {
                    const state = [...states].reverse().find((s: any) => !isMultiple(s) && holds(entityOf(s), source))
                    if (state) {
                      const isRelation = isA(source, 'Platform:EntityRelation') && !source.composite
                      const key = isRelation ? `${camel(source.name)}${source.multiple ? 'Ids' : 'Id'}` : camel(source.name)
                      return `${camel(state.name)}?.${key}`
                    }
                  }
                  log.warning(`${el._path()}: ${source._path?.() ?? '(none)'} is out of reach, not written`)
                  return undefined
                }
                // What a value reads or computes, as TypeScript; nothing for a value written.
                const readOf = (value: any): string | undefined => {
                  if (value?.expression) return `${constantOf(el, value)}(scope)`
                  if (value?.source) return sourceText(value.source) ?? 'undefined'
                  return undefined
                }
                // The states « vider » empties: a form that reads one is keyed by the
                // times it was emptied (`<state>Cleared`, which `heldOf` declares).
                const cleared: any[] = holder
                  ? treeOf(holder.content ?? holder)
                      .flatMap((part: any) => asList(part.actions))
                      .filter((action: any) => action.instanceOf?.name === 'ClearState' && action.state)
                      .map((action: any) => action.state)
                  : []
                // The schema type of the entity of a state that holds documents.
                const schemaOf = (state: any): string | undefined => {
                  const entity = entityOf(state)
                  return isA(entity, 'Platform:Entity') ? pascal(entity.name) : undefined
                }
                // The function of an event: its actions, in order (runActions). It stops
                // with `false` for an event of a card, which the « lever » of the
                // composition reads; with nothing for an event of the platform.
                const handlerOf = (value: any, event: string, card = false): string | undefined => {
                  const payload = event === 'onClick' ? 'undefined' : 'value'
                  const stop = card ? 'return false' : 'return'
                  const submission = event === 'onSubmit' && component?.name === 'Form'
                  const lines: string[] = []
                  for (const action of asList(value.actions)) {
                    const kind = action.instanceOf?.name
                    const target = action.state ?? action.event
                    if (action.instanceOf?._path?.() !== `Platform:actions.${kind}`) {
                      log.warning(`${action._path()}: not an action, the actions after it are not written`)
                      break
                    }
                    const schema = states.includes(target) ? schemaOf(target) : undefined
                    if (kind === 'SetState' && states.includes(target)) {
                      lines.push(`set${pascal(target.name)}(${payload})`)
                    } else if (kind === 'ClearState' && states.includes(target)) {
                      lines.push(`set${pascal(target.name)}(undefined)`)
                      lines.push(`set${pascal(target.name)}Cleared((n) => n + 1)`)
                    } else if (kind === 'RaiseEvent' && holder && target?._getComposer?.() === holder) {
                      lines.push(`if ((await ${camel(target.name)}?.(${payload})) === false) ${stop}`)
                    } else if (kind === 'SaveDocument' && schema) {
                      // On the submission of a form, the draft; the state then holds the
                      // document saved, which the actions after it receive (C9).
                      const name = camel(target.name)
                      lines.push('{')
                      lines.push(`  const saved = await saveDocument(${schema}, ${submission ? payload : name}, services)`)
                      lines.push(`  if (saved === false) ${stop}`)
                      if (submission) lines.push('  if (saved) {', `    set${pascal(target.name)}(saved)`, `    ${payload} = saved`, '  }')
                      else lines.push(`  if (saved && !${name}?._id) set${pascal(target.name)}(saved)`)
                      lines.push('}')
                    } else if (kind === 'DeleteDocument' && schema) {
                      lines.push('{')
                      lines.push(`  const deleted = await deleteDocument(${schema}, ${camel(target.name)}, services)`)
                      lines.push(`  if (deleted === false) ${stop}`)
                      lines.push(`  if (deleted) set${pascal(target.name)}(undefined)`)
                      lines.push('}')
                    } else {
                      log.warning(`${action._path()}: the action ${kind} is not written, the actions after it are not either`)
                      break
                    }
                  }
                  if (lines.length === 0) return undefined
                  const params = payload === 'value' ? '(value)' : '()'
                  return `{async ${params} => {\n${lines.map((line) => `${pad}  ${line}`).join('\n')}\n${pad}}}`
                }

                const component: any = isA(el, 'Platform:component.ComponentInstance') ? el.component : undefined
                if (!component) {
                  log.warning(`${el._path()}: not a placed component, skipped`)
                  return ''
                }

                // A card of a composition: the component written for the composition.
                if (isA(component, 'Platform:component.Composition')) {
                  const attrs: string[] = []
                  for (const property of asList(component.properties)) {
                    const value = valueOf(property.name)
                    if (!value) continue
                    const name = this.camelOf(property.name)
                    const vocation = property.instanceOf?.name
                    if (vocation === 'EventProperty') {
                      const handler = handlerOf(value, name, true)
                      if (handler) attrs.push(`${name}=${handler}`)
                      continue
                    }
                    const read = readOf(value)
                    if (read) {
                      attrs.push(`${name}={${read}}`)
                      continue
                    }
                    const written = value.value
                    if (vocation === 'I18nTextProperty') {
                      const text = textOf(written)
                      if (text) attrs.push(`${name}=${text}`)
                    } else if (vocation === 'ElementProperty') {
                      const entity = elementsOf(value)[0]
                      if (entity?.instanceOf?._inherits?.(e('Platform:Entity'))) attrs.push(`${name}={${this.pascalOf(entity.name)}}`)
                      else log.warning(`${el._path()}: the value of ${property.name} is not written`)
                    } else if (typeof written === 'string') attrs.push(`${name}=${quote(written)}`)
                    else if (typeof written === 'number') attrs.push(`${name}={${written}}`)
                    else if (typeof written === 'boolean') attrs.push(written ? name : `${name}={false}`)
                    else log.warning(`${el._path()}: the value of ${property.name} is not written`)
                  }
                  return tag(this.pascalOf(component.name), attrs, [])
                }

                const inCatalogue = component._getModel?.()?.name === 'PlatformComponents'
                const pkg = component._getComposer?.()?.name

                // A state, a subscription: the component written for its composition or
                // its page holds it.
                if (inCatalogue && pkg === 'data' && ['State', 'Subscription'].includes(component.name)) return ''

                // A form (PLAT-1293): the draft of the document it reads, a new one when
                // it reads nothing, its controls chosen by the type of each field; its
                // submission plays `onSubmit` with the draft, whose actions show their
                // own messages (`quiet`). Keyed by the key of the document, another
                // document starts it again; « vider » too (E5, E9).
                if (inCatalogue && pkg === 'data' && component.name === 'Form') {
                  const value = valueOf('document')
                  const source = value?.source
                  const entity = isState(source) ? entityOf(source) : source?._getComposer?.() === holder ? source?.entity : undefined
                  const read = readOf(value)
                  if (!read || !isA(entity, 'Platform:Entity')) {
                    log.warning(`${el._path()}: the form reads no document of an entity, skipped`)
                    return ''
                  }
                  const fresh = isState(source) && cleared.includes(source) ? `\`new:\${${camel(source.name)}Cleared}\`` : "'new'"
                  const attrs = [
                    `key={String(${read}?._id ?? ${fresh})}`,
                    `schema={${pascal(entity.name)}}`,
                    `entity={${read}}`,
                    'controlComponent={DocFieldControl}',
                    'quiet',
                    'emptyTextIsMissing'
                  ]
                  const submit = valueOf('onSubmit') ? handlerOf(valueOf('onSubmit'), 'onSubmit') : undefined
                  if (submit) attrs.push(`onSubmit=${submit}`)
                  const style = styleOf(valueOf('style')?.value)
                  if (style) attrs.push(`style=${style}`)
                  return tag('SchemaForm', attrs, childrenOf(zoneOf('children'), indent + 2))
                }

                // A field control (PLAT-1293 CF1): the control of its field, under the
                // key the document keeps it (`clientId` for the link `client`).
                if (inCatalogue && pkg === 'data' && component.name === 'EntityFieldControl') {
                  const feature = elementsOf(valueOf('field'))[0]
                  const isRelation = isA(feature, 'Platform:EntityRelation')
                  if (!feature || (isRelation && feature.composite)) {
                    log.warning(`${el._path()}: a field control without a field, or on a composite link, is not written, skipped`)
                    return ''
                  }
                  const key = isRelation ? `${camel(feature.name)}${feature.multiple ? 'Ids' : 'Id'}` : camel(feature.name)
                  const control = tag('DocFieldControl', [`name='${key}'`], [], pad)
                  const style = styleOf(valueOf('style')?.value)
                  if (!style) return control
                  return tag('Column', [`style=${style}`], [tag('DocFieldControl', [`name='${key}'`], [], `${pad}  `)])
                }

                // A condition: its children when it holds, else its zone `else`
                // (conditionHolds: a value that is not a boolean holds when it is not empty).
                if (inCatalogue && pkg === 'logic' && component.name === 'If') {
                  const value = valueOf('condition')
                  const read = readOf(value)
                  const condition = read
                    ? `holds(${read})`
                    : typeof value?.value === 'boolean'
                      ? String(value.value)
                      : 'false'
                  const branch = (elements: any[]): string => {
                    const lines = childrenOf(elements, indent + 4)
                    return lines.length ? `(\n${pad}  <>\n${lines.join('\n')}\n${pad}  </>\n${pad})` : 'null'
                  }
                  return `${pad}{${condition} ? ${branch(zoneOf('children'))} : ${branch(zoneOf('else'))}}`
                }

                // A table that shows a list (PLAT-1008): each column the value its name
                // gives in the row, written as the platform writes a cell; the row lit is
                // the one whose key `selected` gives; a click plays `onSelect`.
                if (inCatalogue && component.name === 'Table') {
                  const rows = readOf(valueOf('items'))
                  const columns = zoneOf('columns')
                  if (!rows || columns.length === 0) {
                    log.warning(`${el._path()}: a Table without a list or without a column is not written, skipped`)
                    return ''
                  }
                  const keyName = typeof valueOf('keyName')?.value === 'string' && valueOf('keyName').value ? valueOf('keyName').value : '_id'
                  const member = (name: string): string => (/^[A-Za-z_$][\w$]*$/.test(name) ? `.${name}` : `[${JSON.stringify(name)}]`)
                  const cell = (name: string): string => `(row as unknown as Record<string, unknown>)${member(name)}`
                  const attrs: string[] = [
                    `columns={[\n${columns
                      .map((column: any) => {
                        const title = textOf(asList(column.values).find((v: any) => v.property?.name === 'title')?.value)
                        return `${pad}  { name: '${column.name}', ${title ? `title: ${title}, ` : ''}render: (row) => formatCell(${cell(column.name)}, language) }`
                      })
                      .join(',\n')}\n${pad}]}`,
                    `rows={${rows} ?? []}`,
                    `getRowKey={(row, index) => String(${cell(keyName)} ?? index)}`
                  ]
                  const selected = readOf(valueOf('selected'))
                  if (selected) attrs.push(`selectedKey={String((${selected} as unknown as Record<string, unknown> | undefined)?.${member(keyName).replace(/^\./, '')} ?? '')}`)
                  const onSelect = valueOf('onSelect') ? handlerOf(valueOf('onSelect'), 'onSelect') : undefined
                  if (onSelect) attrs.push(`onSelect=${onSelect}`)
                  const style = styleOf(valueOf('style')?.value)
                  if (style) attrs.push(`style=${style}`)
                  return tag('Table', attrs, [])
                }

                // A component of the platform, by the name of its component.
                const CORE = ['Row', 'Column', 'Grid', 'Page', 'Section', 'FormLayout', 'Toolbar', 'Divider', 'Button', 'Text', 'Tabs', 'Tab']
                const name = component.name
                if (!inCatalogue || !CORE.includes(name)) {
                  log.warning(`${el._path()}: the component ${component._path?.() || '(none)'} is not written, skipped`)
                  return ''
                }
                const attrs: string[] = []
                for (const property of asList(component.properties)) {
                  const prop = property.name
                  if (prop === 'children') continue
                  const value = valueOf(prop)
                  if (!value) continue
                  const vocation = property.instanceOf?.name
                  if (vocation === 'EventProperty') {
                    const handler = handlerOf(value, prop)
                    if (handler) attrs.push(`${prop}=${handler}`)
                    continue
                  }
                  const read = readOf(value)
                  if (read) {
                    attrs.push(vocation === 'I18nTextProperty' ? `${prop}={asText(${read})}` : `${prop}={${read}}`)
                    continue
                  }
                  const written = value.value
                  if (vocation === 'I18nTextProperty') {
                    const text = textOf(written)
                    if (text) attrs.push(`${prop}=${text}`)
                  } else if (vocation === 'StyleProperty') {
                    const style = styleOf(written)
                    if (style) attrs.push(`${prop}=${style}`)
                  } else if (vocation === 'ZoneProperty') {
                    const slot = childrenOf(asList(value.children), indent + 4)
                    if (slot.length) attrs.push(`${prop}={\n${pad}  <>\n${slot.join('\n')}\n${pad}  </>\n${pad}}`)
                  } else if (written === undefined || written === null || written === '') continue
                  // A choice that is a number in the platform (`FormLayout` columns `'1'`).
                  else if (vocation === 'EnumProperty' && typeof written === 'string' && /^\d+$/.test(written)) attrs.push(`${prop}={${written}}`)
                  else if (typeof written === 'string') attrs.push(`${prop}=${quote(written)}`)
                  else if (typeof written === 'number') attrs.push(`${prop}={${written}}`)
                  else if (typeof written === 'boolean') attrs.push(written ? prop : `${prop}={false}`)
                  else log.warning(`${el._path()}: the prop ${prop} is not written`)
                }
                return tag(name, attrs, childrenOf(zoneOf('children'), indent + 2))
              }
          - name: textKeyOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: element
                instanceOf: Core:InputFeature
                mandatory: true
                type: Platform:I18nString
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The key of a translated text in the texts of the application, without
               * its namespace: the path of the `Platform:I18nString` from its model, or from
               * the package that holds it (`boutique.route.Client.entityScreen.title`).
               * Two texts never share a key, and the key does not move while the model
               * keeps its names, nor when the application moves into a package
               * (PLAT-1157).
               */
              export default function (element) {
                const live: any = element
                // A text written as the value of a placed component takes the path of its
                // value: the title of a card keeps the key it had (PLAT-1399 P3).
                const composer: any = live._getComposer()
                const owner: any = composer?.instanceOf?._inherits?.(e('Platform:component.PropertyValue'))
                  ? composer
                  : live
                const path: string = owner._path()
                let holder: any = owner._getComposer()
                while (holder && !holder._isModel() && !holder._isPackage()) holder = holder._getComposer()
                if (!holder || holder._isModel()) return path.slice(path.indexOf(':') + 1)
                return path.slice(holder._path().length + 1)
              }
